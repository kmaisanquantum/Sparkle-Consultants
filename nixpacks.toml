providers = ['node', 'python']

[phases.setup]
nixPkgs = ['nodejs_20', 'python312Packages.pip', 'python312Full', 'tesseract', 'poppler_utils', 'libpqxx']
aptPkgs = ['tesseract-ocr', 'poppler-utils', 'libpq5']

[phases.build]
cmds = [
    'cd frontend && npm ci && npm run build',
    'mkdir -p backend/static',
    'cp -r frontend/dist/* backend/static/',
    'pip install -r backend/requirements.txt'
]

[start]
cmd = 'cd backend && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2'
