providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20", "python312", "tesseract", "poppler_utils", "postgresql"]

[phases.install]
cmds = [
    "cd frontend && npm ci && npm run build",
    "python3 -m venv /opt/venv",
    ". /opt/venv/bin/activate && pip install -r backend/requirements.txt",
    "mkdir -p backend/static",
    "cp -r frontend/dist/* backend/static/"
]

[phases.build]
cmds = []

[start]
cmd = ". /opt/venv/bin/activate && cd backend && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
